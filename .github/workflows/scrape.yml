name: Scrape fresher postings

on:
  schedule:
    # Runs twice a day at 02:00 UTC and 14:00 UTC (~7:30 AM & 7:30 PM IST)
    - cron: "0 2,14 * * *"
  workflow_dispatch: {} # Manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Run fresher scraper & AI enrichment
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scrape.js

      - name: Commit updated data and static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/jobs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-refresh fresher job postings and AI prep guides [skip ci]"
          git push

