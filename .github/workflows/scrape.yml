name: Scrape fresher postings

on:
  schedule:
    # Runs once a day at 03:00 UTC (~8:30 AM IST). Edit this if you want a different time.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # lets you click "Run workflow" manually on GitHub any time

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Install headless browser
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        run: node scrape.js

      - name: Generate AI articles & reel scripts
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-content.js

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "fresherhub-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update job postings + AI content"
          git push
