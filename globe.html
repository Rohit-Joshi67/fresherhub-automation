function latLngToCartesian(lat, lng, radius) {
  const phi = ((90 - lat) * Math.PI) / 180;
  const theta = ((lng + 180) * Math.PI) / 180;
  return {
    x: -radius * Math.sin(phi) * Math.cos(theta),
    y: radius * Math.cos(phi),
    z: radius * Math.sin(phi) * Math.sin(theta),
  };
}
function cartesianToLatLng(x, y, z) {
  const r = Math.hypot(x, y, z) || 1;
  const lat = (Math.asin(y / r) * 180) / Math.PI;
  const lng = (Math.atan2(z, -x) * 180) / Math.PI - 180;
  return { lat, lng };
}
function haversine(lat1, lng1, lat2, lng2) {
  const tr = (d) => (d * Math.PI) / 180;
  const dLat = tr(lat2 - lat1), dLng = tr(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(tr(lat1))*Math.cos(tr(lat2))*Math.sin(dLng/2)**2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(a)));
}
function nearestLocation(lat, lng) {
  let best = LOCATIONS[0], bestD = Infinity;
  for (const loc of LOCATIONS) {
    const d = haversine(lat, lng, loc.lat, loc.lng);
    if (d < bestD) { bestD = d; best = loc; }
  }
  return best;
}
function slerpUnit(ax,ay,az,bx,by,bz,t) {
  const dot = Math.min(1, Math.max(-1, ax*bx+ay*by+az*bz));
  const omega = Math.acos(dot);
  if (omega < 1e-4) return {x:ax,y:ay,z:az};
  const sinO = Math.sin(omega);
  const s0 = Math.sin((1-t)*omega)/sinO, s1 = Math.sin(t*omega)/sinO;
  return {x:ax*s0+bx*s1, y:ay*s0+by*s1, z:az*s0+bz*s1};
}
function easeOutCubic(t){ return 1 - (1-t)**3; }
function greatCircle(a,b,n=56){
  const pa = latLngToCartesian(a.lat,a.lng,1);
  const pb = latLngToCartesian(b.lat,b.lng,1);
  const pts = [];
  for (let i=0;i<=n;i++){
    const t=i/n;
    const s = slerpUnit(pa.x,pa.y,pa.z,pb.x,pb.y,pb.z,t);
    const lift = 1 + Math.sin(t*Math.PI)*0.12;
    pts.push(new THREE.Vector3(s.x*lift, s.y*lift, s.z*lift));
  }
  return pts;
}
function makeGlowTexture(){
  const c = document.createElement("canvas"); c.width=c.height=64;

  const grd = g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,"rgba(255,255,255,1)");
  grd.addColorStop(0.25,"rgba(255,255,255,.55)");
  grd.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=grd; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

void main(){ vec4 world = modelMatrix * vec4(position,1.0); vWorldPos=world.xyz; vNormal=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*world; }`;
const ATM_FRAG = `uniform vec3 uColor; uniform float uPower; uniform float uIntensity;
varying vec3 vNormal; varying vec3 vWorldPos;
void main(){ vec3 viewDir=normalize(cameraPosition-vWorldPos); float fresnel=pow(1.0-abs(dot(viewDir,normalize(vNormal))), uPower); gl_FragColor=vec4(uColor*fresnel*uIntensity, fresnel*0.92); }`;

class GlobeEngine {
  constructor(opts){
    this.opts=opts; this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(38,1,0.1,120);
    this.camera.position.set(1.15,0.62,2.55);
    this.raycaster=new THREE.Raycaster(); this.pointer=new THREE.Vector2();
    this.tmp=new THREE.Vector3(); this.markers=[]; this.arcs=[];
    this.selectedId=null; this.hoveredId=null; this.focus=null;
    this.autoRotate=true; this.reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(this.reduceMotion) this.autoRotate=false;
    this.clock={last:performance.now()}; this.disposed=false; this.resumeTimer=null;
    this.pointerDown={x:0,y:0,active:false};
    try{ this.init(); } catch(e){ console.error(e); opts.onFail(); }
  }
  setSelected(id){
    if(this.selectedId===id) return;
    this.selectedId=id; this.updateMarkerStates(); this.updateArcs();
    if(id) this.beginFocus(id);
  }
  setHovered(id){
    if(this.hoveredId===id) return;
    this.hoveredId=id; this.updateMarkerStates(); this.positionFloat();
  }
  dispose(){
    this.disposed=true; if(this.resumeTimer) clearTimeout(this.resumeTimer);
    this.resizeObs?.disconnect(); this.renderer?.setAnimationLoop(null); this.controls?.dispose();
    this.scene.traverse(obj=>{ if(obj.geometry) obj.geometry.dispose(); const m=obj.material; if(Array.isArray(m)) m.forEach(x=>x.dispose()); else if(m) m.dispose(); });
    this.renderer?.dispose();
  }
  init(){
    const {container, canvas} = this.opts;
    const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:"high-performance"});
    renderer.setClearColor(0x08090c,1);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.12;
    this.renderer=renderer;
    this.scene.fog=new THREE.FogExp2(0x08090c,0.045);
    const ambient=new THREE.AmbientLight(0xb7c4d2,0.38);
    const hemi=new THREE.HemisphereLight(0xc9d4e0,0x0b1016,0.7);
    const sun=new THREE.DirectionalLight(0xf3efe6,1.55); sun.position.set(4.2,2.2,3.4);
    this.fillLight=new THREE.DirectionalLight(0x7f98ae,0.55);
    this.scene.add(ambient,hemi,sun,this.fillLight);
    this.addStars(); this.addEarth(); this.addAtmosphere(); this.addMarkers(); this.addArcs();
    const controls=new OrbitControls(this.camera, renderer.domElement);
    controls.enablePan=false; controls.enableDamping=true; controls.dampingFactor=0.07;
    controls.autoRotate=this.autoRotate; controls.autoRotateSpeed=0.42;
    controls.minDistance=2.15; controls.maxDistance=3.9;
    controls.minPolarAngle=0.28; controls.maxPolarAngle=Math.PI-0.28;
    controls.rotateSpeed=0.55; controls.zoomSpeed=0.85; controls.target.set(0,0,0); controls.update();
    this.controls=controls;
    controls.addEventListener("start",()=>{ this.autoRotate=false; controls.autoRotate=false; this.opts.onInteracting(true); this.clearResume(); });
    controls.addEventListener("end",()=>{ this.opts.onInteracting(false); this.scheduleResume(); });
    this.bindPointer(renderer.domElement);
    this.resize(); this.resizeObs=new ResizeObserver(()=>this.resize()); this.resizeObs.observe(container);
    this.loadTextures();
    renderer.setAnimationLoop(()=>this.tick());
    this.opts.onReady();
  }
  loadTextures(){
    const loader=new THREE.TextureLoader();
    loader.load(DAY_URL, tex=>{
      tex.colorSpace=THREE.SRGBColorSpace;
      tex.anisotropy=this.renderer?.capabilities.getMaxAnisotropy()??1;
      if(this.earth){ const mat=this.earth.material; mat.map=tex; mat.color.set(0xffffff); mat.needsUpdate=true; }
    });
    loader.load(NIGHT_URL, tex=>{
      tex.colorSpace=THREE.SRGBColorSpace;
      if(this.earth){ const mat=this.earth.material; mat.emissiveMap=tex; mat.emissive.set(0xc8d6e2); mat.emissiveIntensity=0.55; mat.needsUpdate=true; }
    });
  }
  addEarth(){
    const geo=new THREE.SphereGeometry(GLOBE_R,96,64);
    const mat=new THREE.MeshStandardMaterial({color:0x1a2733, roughness:0.92, metalness:0.08, emissive:0x0a1218, emissiveIntensity:0.2});
    this.earth=new THREE.Mesh(geo,mat); this.scene.add(this.earth);
    const clouds=new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R*1.008,64,48), new THREE.MeshStandardMaterial({color:0xd7e2ea, transparent:true, opacity:0.045, roughness:1, depthWrite:false}));
    this.clouds=clouds; this.scene.add(clouds);
  }
  addAtmosphere(){
    const geo=new THREE.SphereGeometry(GLOBE_R,80,56);
    const make=(side,power,intensity,scale)=>{
      const mat=new THREE.ShaderMaterial({
        vertexShader:ATM_VERT, fragmentShader:ATM_FRAG,
        uniforms:{ uColor:{value:new THREE.Color("#9bb4c8")}, uPower:{value:power}, uIntensity:{value:intensity} },
        transparent:true, depthWrite:false, side, blending:THREE.AdditiveBlending, toneMapped:false,
      });
      const mesh=new THREE.Mesh(geo,mat); mesh.scale.setScalar(scale); this.scene.add(mesh);
    };
    make(THREE.BackSide,3.2,1.35,1.14); make(THREE.FrontSide,4.6,0.55,1.02);
  }
  addStars(){
    const count=1800, pos=new Float32Array(count*3);
    for(let i=0;i<count;i++){
      const r=18+Math.random()*42, u=Math.random(), v=Math.random();
      const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
      pos[i*3]=r*Math.sin(phi)*Math.cos(theta); pos[i*3+1]=r*Math.cos(phi); pos[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
    }
    const geo=new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
    this.scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xe4e2dc, size:0.045, sizeAttenuation:true, transparent:true, opacity:0.85, depthWrite:false})));
  }
  addMarkers(){
    const glowTex=makeGlowTexture();
    const glowMat=new THREE.SpriteMaterial({map:glowTex, color:0xe8eef2, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, toneMapped:false});
    const aiGlow=glowMat.clone(); aiGlow.color.set(0x8fc9c0);
    const coreMat=new THREE.MeshBasicMaterial({color:0xf2f5f7, toneMapped:false});
    const aiCore=new THREE.MeshBasicMaterial({color:0xb7ebe4, toneMapped:false});
    const ringMat=new THREE.MeshBasicMaterial({color:0xd5e2ea, transparent:true, opacity:0, side:THREE.DoubleSide, toneMapped:false});
    const aiRing=ringMat.clone(); aiRing.color.set(0x8fc9c0);
    const hitMat=new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});
    const coreGeo=new THREE.SphereGeometry(0.02,16,12);
    const hitGeo=new THREE.SphereGeometry(0.058,12,10);
    const ringGeo=new THREE.RingGeometry(0.034,0.046,32);
    for(const loc of LOCATIONS){
      const isAi=loc.track==="ai";
      const group=new THREE.Group();
      const p=latLngToCartesian(loc.lat, loc.lng, MARKER_R);
      group.position.set(p.x,p.y,p.z); group.lookAt(0,0,0);
      const core=new THREE.Mesh(coreGeo, isAi?aiCore:coreMat);
      const glow=new THREE.Sprite(isAi?aiGlow:glowMat); glow.scale.setScalar(0.2);
      const ring=new THREE.Mesh(ringGeo, isAi?aiRing:ringMat); ring.rotation.x=Math.PI;
      const hit=new THREE.Mesh(hitGeo, hitMat); hit.userData.locationId=loc.id;
      group.add(core,glow,ring,hit); this.scene.add(group);
      this.markers.push({id:loc.id, group, glow, core, ring, hit, isAi, baseGlow:0.2});
    }
  }
  addArcs(){
    this.arcMat=new THREE.LineBasicMaterial({color:0x8aa3b5, transparent:true, opacity:0.22});
    this.arcActive=new THREE.LineBasicMaterial({color:0xb7d4d0, transparent:true, opacity:0.7});
    for(let i=0;i<LOCATIONS.length-1;i++){
      const pts=greatCircle(LOCATIONS[i], LOCATIONS[i+1], 56);
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), this.arcMat);
      this.scene.add(line); this.arcs.push({line, fromId:LOCATIONS[i].id, toId:LOCATIONS[i+1].id});
    }
  }
  bindPointer(el){
    el.addEventListener("pointerdown", e=>{ this.pointerDown={x:e.clientX,y:e.clientY,active:true}; });
    el.addEventListener("pointerup", e=>{
      if(!this.pointerDown.active) return;
      const dx=e.clientX-this.pointerDown.x, dy=e.clientY-this.pointerDown.y; this.pointerDown.active=false;
      if(dx*dx+dy*dy>36) return; this.handleClick(e);
    });
    el.addEventListener("pointermove", e=>this.handleMove(e));
    el.addEventListener("pointerleave", ()=>{ if(this.hoveredId){ this.hoveredId=null; this.opts.onHover(null); this.updateMarkerStates(); this.positionFloat(); }});
  }
  ndcFromEvent(e){
    const rect=this.renderer.domElement.getBoundingClientRect();
    this.pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
    this.pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  }
  handleMove(e){
    if(!this.renderer) return; this.ndcFromEvent(e);
    this.raycaster.setFromCamera(this.pointer, this.camera);
    const hits=this.raycaster.intersectObjects(this.markers.map(m=>m.hit), false);
    const id=hits[0]?.object.userData.locationId ?? null;
    if(id!==this.hoveredId){ this.hoveredId=id; this.opts.onHover(id); this.updateMarkerStates(); this.positionFloat(); }
    this.renderer.domElement.style.cursor=id?"pointer":"grab";
  }
  handleClick(e){
    if(!this.renderer) return; this.ndcFromEvent(e);
    this.raycaster.setFromCamera(this.pointer, this.camera);
    const mh=this.raycaster.intersectObjects(this.markers.map(m=>m.hit), false);
    if(mh[0]){ const id=mh[0].object.userData.locationId; this.opts.onSelect(id); this.setSelected(id); return; }
    if(this.earth){
      const eh=this.raycaster.intersectObject(this.earth,false);
      if(eh[0]){ const p=eh[0].point; const ll=cartesianToLatLng(p.x,p.y,p.z); const n=nearestLocation(ll.lat,ll.lng); this.opts.onSelect(n.id); this.setSelected(n.id); return; }
    }
    this.opts.onSelect(null); this.setSelected(null);
  }
  beginFocus(id){
    const loc=locById(id); if(!loc||!this.controls) return;
    const dest=latLngToCartesian(loc.lat, loc.lng, 1);
    const from=this.camera.position.clone().normalize();
    this.focus={ fromDir:from, toDir:new THREE.Vector3(dest.x,dest.y,dest.z).normalize(), fromDist:this.camera.position.length(), toDist:2.52, t:0, duration:this.reduceMotion?0.2:1.05 };
    this.autoRotate=false; this.controls.autoRotate=false; this.controls.enableRotate=false; this.controls.enableZoom=false;
    this.clearResume(); this.scheduleResume(4200);
  }
  updateMarkerStates(){
    for(const m of this.markers){
      const on=m.id===this.selectedId, hover=m.id===this.hoveredId;
      m.ring.material.opacity=on?0.95:hover?0.45:0;
      m.baseGlow=on?0.34:hover?0.26:0.2;
      m.core.scale.setScalar(on?1.35:hover?1.15:1);
    }
  }
  updateArcs(){
    for(const arc of this.arcs){
      const on=this.selectedId && (arc.fromId===this.selectedId || arc.toId===this.selectedId);
      arc.line.material=on?this.arcActive:this.arcMat;
    }
  }
  positionFloat(){
    const el=this.opts.floatEl; if(!el) return;
    const id=this.hoveredId;
    if(!id||!this.renderer){ el.style.opacity="0"; return; }
    const marker=this.markers.find(m=>m.id===id); if(!marker){ el.style.opacity="0"; return; }
    this.tmp.copy(marker.group.position).project(this.camera);
    const rect=this.renderer.domElement.getBoundingClientRect();
    const x=(this.tmp.x*0.5+0.5)*rect.width, y=(-this.tmp.y*0.5+0.5)*rect.height;
    el.style.opacity=this.tmp.z>1?"0":"1";
    el.style.transform=`translate3d(${x}px, ${y}px, 0) translate(-50%, calc(-100% - 14px))`;
    const loc=locById(id); el.innerHTML=loc?`${loc.city} <span>· ${loc.title}</span>`:"";
  }
  tick(){
    if(this.disposed||!this.renderer||!this.controls) return;
    const now=performance.now(); const delta=Math.min((now-this.clock.last)/1000,0.1); this.clock.last=now; const elapsed=now/1000;
    if(this.clouds) this.clouds.rotation.y+=delta*0.012;
    if(this.focus){
      this.focus.t+=delta/this.focus.duration;
      const k=easeOutCubic(Math.min(1,this.focus.t));
      const d=slerpUnit(this.focus.fromDir.x,this.focus.fromDir.y,this.focus.fromDir.z,this.focus.toDir.x,this.focus.toDir.y,this.focus.toDir.z,k);
      const dist=this.focus.fromDist+(this.focus.toDist-this.focus.fromDist)*k;
      this.camera.position.set(d.x*dist,d.y*dist,d.z*dist);
      this.controls.target.set(0,0,0); this.camera.lookAt(0,0,0);
      if(this.focus.t>=1){ this.focus=null; this.controls.enableRotate=true; this.controls.enableZoom=true; }
    } else { this.controls.update(delta); }
    for(const m of this.markers){ const pulse=1+Math.sin(elapsed*2.2+m.group.id)*(m.id===this.selectedId?0.14:0.08); m.glow.scale.setScalar(m.baseGlow*pulse); }
    if(this.fillLight) this.fillLight.position.copy(this.camera.position);
    this.positionFloat(); this.renderer.render(this.scene,this.camera);
  }
  resize(){
    if(!this.renderer) return;
    const {container}=this.opts; const w=container.clientWidth||innerWidth, h=container.clientHeight||innerHeight;
    this.camera.aspect=w/Math.max(1,h); this.camera.updateProjectionMatrix(); this.renderer.setSize(w,h,false);
  }
  scheduleResume(ms=2200){ this.clearResume(); this.resumeTimer=window.setTimeout(()=>{ if(this.reduceMotion||!this.controls) return; this.autoRotate=true; this.controls.autoRotate=true; }, ms); }
  clearResume(){ if(this.resumeTimer){ clearTimeout(this.resumeTimer); this.resumeTimer=null; } }
}

/* ---------- UI ---------- */
const state={ selected:null, hovered:null, filter:"all", mobile:"list", interacting:false };
const params=new URLSearchParams(location.search);
const startCity=params.get("city");
const startTrack=params.get("track");
if(startTrack && TRACK_ORDER.includes(startTrack)) state.filter=startTrack;
if(startCity && locById(startCity)) state.selected=startCity;

const listPanel=document.getElementById("listPanel");
const topicPanel=document.getElementById("topicPanel");
const mobileSheet=document.getElementById("mobileSheet");
const rotateChip=document.getElementById("rotateChip");
const failEl=document.getElementById("fail");

function neighbor(id){
  const i=LOCATIONS.findIndex(l=>l.id===id);
  return { prev: i>0?LOCATIONS[i-1].id:null, next: i>=0&&i<LOCATIONS.length-1?LOCATIONS[i+1].id:null };
}
function filtered(){ return state.filter==="all"?LOCATIONS:LOCATIONS.filter(l=>l.track===state.filter); }

function renderList(el, compact){
  const items=filtered().map(loc=>{
    const on=loc.id===state.selected, hover=loc.id===state.hovered;
    return `<li><button type="button" data-id="${loc.id}" class="${on?"on":""}">
      <span class="n">${String(loc.stage).padStart(2,"0")}</span>
      <span style="min-width:0;flex:1;"><span class="t">${loc.city}</span><span class="meta">${loc.title}</span></span>
      <span class="dot ${loc.track==="ai"?"ai":""}"></span>
    </button></li>`;
  }).join("");
  const chips=`<button type="button" class="fchip ${state.filter==="all"?"on":""}" data-filter="all">All</button>`+
    TRACK_ORDER.map(t=>`<button type="button" class="fchip ${state.filter===t?"on":""}" data-filter="${t}">${TRACKS[t].label}</button>`).join("");
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <h2>Featured locations</h2><span class="count">${LOCATIONS.length}</span></div>
    <div class="filters">${chips}</div>
    <ul class="list" style="${compact?"max-height:22vh":""}">${items}</ul>`;
  el.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{ state.filter=b.dataset.filter; render(); }));
  el.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id)));
}
function renderTopic(el, compact){
  const loc=locById(state.selected);
  if(!loc){
    el.innerHTML=`<p class="topic-kicker">Chapter</p>
      <h2 class="topic-title">Click the globe.</h2>
      <p class="topic-sum">Fifteen cities, one path: Java from the JVM to production agents. Click a marker, a city in the list, or anywhere on the earth — the nearest chapter opens with its topics.</p>`;
    return;
  }
  const {prev,next}=neighbor(loc.id);
  const topics=loc.topics.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join("");
  el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">
      <div style="min-width:0;"><p class="topic-kicker">${TRACKS[loc.track].label}</p>
      <h2 class="topic-title">${loc.title}</h2>
      <p class="topic-city">${loc.city}, ${loc.region}</p></div>
      <button type="button" class="btn" id="closeTopic" style="height:36px;">Close</button></div>
    <p class="count" style="margin:10px 0 0;">Stage ${loc.stage} of ${LOCATIONS.length} · ${loc.weeks}</p>
    <p class="topic-sum"${compact?' style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;"':""}>${loc.summary}</p>
    <p class="topics-label">Topics</p>
    <ol class="topics"${compact?' style="max-height:18vh;"':""}>${topics}</ol>
    <div class="nav-row">
      <button class="btn" id="prevBtn" ${prev?"":"disabled"}>← Prev</button>
      <button class="btn primary" id="nextBtn" ${next?"":"disabled"}>Next →</button>
    </div>`;
  el.querySelector("#closeTopic")?.addEventListener("click",()=>select(null));
  el.querySelector("#prevBtn")?.addEventListener("click",()=>prev&&select(prev));
  el.querySelector("#nextBtn")?.addEventListener("click",()=>next&&select(next));
}
function render(){
  renderList(listPanel,false);
  renderTopic(topicPanel,false);
  if(state.mobile==="detail" && state.selected) renderTopic(mobileSheet,true);
  else renderList(mobileSheet,true);
  rotateChip.textContent=state.interacting?"Paused":"Auto-rotate";
}

let engine=null;
function select(id){
  state.selected=id;
  if(id) state.mobile="detail"; else state.mobile="list";
  engine?.setSelected(id);
  render();
  if(id){
    const url=new URL(location.href); url.searchParams.set("city", id); history.replaceState(null,"",url);
  }
}
function hover(id){ state.hovered=id; engine?.setHovered(id); }

engine=new GlobeEngine({
  container: document.getElementById("scene"),
  canvas: document.getElementById("globe"),
  floatEl: document.getElementById("float"),
  onSelect: (id)=>{ state.selected=id; state.mobile=id?"detail":"list"; render(); if(id){ const url=new URL(location.href); url.searchParams.set("city", id); history.replaceState(null,"",url);} },
  onHover: (id)=>{ state.hovered=id; },
  onInteracting: (v)=>{ state.interacting=v; rotateChip.textContent=v?"Paused":"Auto-rotate"; },
  onReady: ()=>{},
  onFail: ()=>{ failEl.hidden=false; },
});
if(state.selected) engine.setSelected(state.selected);
render();

window.addEventListener("keydown", (e)=>{
  const tag=e.target.tagName; if(tag==="INPUT"||tag==="TEXTAREA") return;
  if(e.key==="Escape"){ select(null); return; }
  if(!state.selected) return;
  const {prev,next}=neighbor(state.selected);
  if((e.key==="ArrowRight"||e.key==="ArrowDown") && next) select(next);
  if((e.key==="ArrowLeft"||e.key==="ArrowUp") && prev) select(prev);
});
</script>
</body>
</html>
